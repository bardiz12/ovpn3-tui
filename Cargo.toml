[package]
name = "ovpn3-tui"
version = "1.2.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
dirs = "6.0"
chrono = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"

[lints.clippy]
collapsible_if = "allow"
